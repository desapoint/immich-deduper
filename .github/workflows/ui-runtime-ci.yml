name: UI Runtime CI

on:
  push:
    branches:
      - perf/interface-responsiveness
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/ui-runtime-ci.yml"
      - "Dockerfile"
      - "requirements*.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-runtime-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-runtime-regressions:
    name: UI regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build CPU validation image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          load: true
          tags: immich-deduper:ui-validation
          build-args: |
            DEDUP_PORT=8086
            DEVICE=cpu
          push: false
          cache-from: type=gha,scope=immich-deduper-fork-cpu
          cache-to: type=gha,scope=immich-deduper-ui-validation,mode=min

      - name: Compile Python sources
        run: |
          set -euo pipefail
          docker run --rm immich-deduper:ui-validation python -m compileall -q /app/src

      - name: Run Python UI regression tests
        run: |
          set -euo pipefail
          for test in \
            test_face_schema_compat.py \
            test_mdl_img_layout.py \
            test_model_cache_declaration.py \
            test_model_cache_setup_order.py \
            test_model_initialization_guard.py \
            test_model_lock_primitive.py \
            test_model_runtime_contract.py \
            test_sim_group_action_stack.py \
            test_sim_render_keys.py \
            test_sim_render_stack.py \
            test_task_history_retention.py \
            test_ui_page_layouts.py
          do
            echo "==> $test"
            docker run --rm \
              -v "$PWD/tests:/app/tests:ro" \
              -w /app \
              immich-deduper:ui-validation \
              python "tests/$test"
          done

      - name: Run JavaScript UI regression tests
        run: |
          set -euo pipefail
          node --version
          for test in \
            test_live_photo_visibility.js \
            test_mdl_img_ui.js \
            test_notification_ui.js \
            test_poptip_ui.js \
            test_sim_ui_state.js \
            test_stack_selection.js \
            test_store_sync.js \
            test_system_check_ui.js
          do
            echo "==> $test"
            node "tests/$test"
          done
