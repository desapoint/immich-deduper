name: Python Runtime CI

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/test_perf_runtime.py"
      - "requirements-base.txt"
      - ".github/workflows/runtime-ci.yml"
  push:
    branches:
      - main
      - perf/model-memory-management
    paths:
      - "src/**"
      - "tests/test_perf_runtime.py"
      - "requirements-base.txt"
      - ".github/workflows/runtime-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-regressions:
    name: Runtime regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      # ubuntu-latest currently provides Python 3.12, which matches pyproject.toml.
      # Intentionally install only base dependencies: the lazy-import tests must
      # stay green even when torch/torchvision are not installed at all.
      - name: Install base dependencies
        run: |
          set -euo pipefail
          python3 --version
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-base.txt

      - name: Compile Python sources
        run: |
          set -euo pipefail
          python3 -m compileall -q src tests/test_perf_runtime.py

      - name: Run performance/runtime regression tests
        run: |
          set -euo pipefail
          python3 tests/test_perf_runtime.py -v
